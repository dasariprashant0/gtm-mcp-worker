# Deploy gtm-mcp-worker to Cloudflare.
#
# The important part is the gate: `npm run verify` must pass before anything
# deploys. That runs the typecheck, the 73 allowlist assertions (39 operations
# that MUST be rejected — publish, create_version, container delete,
# user_permissions, path traversal — and 34 that must be allowed), the
# parameter-coercion tests, and the two source-discipline checks.
#
# So a change that weakens the safety layer cannot reach production: it fails
# CI first. That is the whole reason this pipeline exists rather than relying
# on someone remembering to run the checks locally.
#
# Note this deploys wrangler.toml AS COMMITTED, including GTM_MODE and
# GTM_FORCE_DRY_RUN. Changing those is a deliberate, reviewable commit.
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN
#   Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
#   -> "Edit Cloudflare Workers" template, scoped to this account.
#   Then: gh secret set CLOUDFLARE_API_TOKEN --repo dasariprashant0/gtm-mcp-worker
#   Without the secret the deploy job skips itself, so forks and this public copy stay green.
#   Optional: a repository variable WORKER_URL (https://<name>.<subdomain>.workers.dev)
#   enables the post-deploy health check.

name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two deploys race.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Allowlist, parameter and source-discipline checks
        run: npm run check
      - name: Bundle (dry run)
        run: npm run dry-run

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check for a Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CLOUDFLARE_API_TOKEN secret is set, so nothing deploys from this run."
          fi
      - uses: cloudflare/wrangler-action@v3
        if: steps.token.outputs.present == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env=""
      - name: Confirm the deployed Worker is healthy
        if: steps.token.outputs.present == 'true' && vars.WORKER_URL != ''
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          sleep 5
          curl -sSf "$WORKER_URL/health" | tee /dev/stderr | grep -qE '"status": *"ok"'
